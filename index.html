<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Let's Go</title>
</head>

<body>
<p id="percent_through_2026"></p>
<progress value=70 max="100"></progress>

</body>

</html>

<script>
    const start = new Date(2026,0,0), end = new Date(2027,0,0), today = new Date();
    const percentage_so_far = Math.round(((today-start )/(end-start)) * 100)
    document.getElementById("percent_through_2026").innerHTML = (percentage_so_far + "%");
</script>
